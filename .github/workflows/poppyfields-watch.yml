name: Poppyfields Watch

on:
  workflow_dispatch:
  push:
    paths:
      - 'poppyfields_watch.py'
      - '.github/workflows/poppyfields-watch.yml'

jobs:
  check:
    name: Run Poppyfields watcher
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        id: watcher
        shell: bash
        run: |
          set +e

          python poppyfields_watch.py > poppyfields-result.json
          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          echo "----- poppyfields_watch.py output -----"
          cat poppyfields-result.json
          echo
          echo "---------------------------------------"
          echo "Watcher exit code: $EXIT_CODE"

          # Do not fail the GitHub job when the watcher returns 2.
          # The JSON result tells ChatGPT which individual checks
          # succeeded or failed.
          exit 0

      - name: Save result
        uses: actions/upload-artifact@v4
        with:
          name: poppyfields-watch-result
          path: poppyfields-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          echo "## Poppyfields Watch" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Watcher exit code: \`${{ steps.watcher.outputs.exit_code }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat poppyfields-result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"


